<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ECS Flask App</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body>
  <div class="container animate__animated animate__fadeIn">
    <h1 class="heading animate__animated animate__fadeInDown">Flask App Running on AWS ECS :)</h1>
    <p class="quote animate__animated animate__fadeInUp">{{ quote }}</p>
    <p class="timestamp animate__animated animate__fadeIn">{{ timestamp }}</p>
    <button id="newQuoteBtn" class="btn animate__animated animate__pulse animate__infinite">New Quote</button>
    <div class="watermark">Project by Ashwin Venkatesan</div>

  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
